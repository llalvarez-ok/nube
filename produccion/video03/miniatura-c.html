/* burbuja de chat de la serie */
.bubble{position:absolute;width:150px;height:112px;background:#fff;border-radius:30px;box-shadow:0 18px 40px #000a,0 0 0 6px #0f0f10;display:flex;align-items:center;justify-content:center;gap:14px;z-index:9}

.bubble svg{position:absolute;right:-22px;top:-26px;width:58px;height:58px;filter:drop-shadow(0 4px 8px #000a)}

.xl .rows span{display:block;height:30px;font:600 13px Inter;color:#666;text-align:center;line-height:30px}
.xl .grid{position:absolute;top:72px;left:40px;right:0;bottom:40px;background-image:linear-gradient(#dfe3e1 1px,transparent 1px),linear-gradient(90deg,#dfe3e1 1px,transparent 1px);background-size:100% 30px,calc(100%/8) 100%}
.xl .tabs{position:absolute;left:0;right:0;bottom:0;height:40px;background:#e9eceb;border-top:1px solid #c9cecc}
.xl .tabs span{position:absolute;left:56px;bottom:0;height:37px;padding:0 20px;background:#fff;border-bottom:4px solid #107C41;font:800 17px Inter;color:#107C41;line-height:35px}

.xl .cards div:after{content:"";display:block;margin:0 14px;width:72%;height:26px;border-radius:6px;background:#107C41}

.xl .bars div{flex:1;background:#107C41;border-radius:4px 4px 0 0;position:relative}
.xl .bars div b{position:absolute;left:50%;bottom:-27px;transform:translateX(-50%);font:700 14px Inter;color:#555}
