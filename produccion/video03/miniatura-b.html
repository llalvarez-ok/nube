html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:Inter,sans-serif;color:#fff}

.bubble{position:absolute;width:150px;height:112px;background:#ffffff;border-radius:30px;box-shadow:0 18px 40px #000a, 0 0 0 6px #0f0f10;display:flex;align-items:center;justify-content:center;gap:14px}

.rows{position:absolute;top:74px;left:0;width:44px;bottom:44px;background:#e9eceb;border-right:1px solid #c9cecc;display:flex;flex-direction:column}

.grid{position:absolute;top:74px;left:44px;right:0;bottom:44px;background-image:linear-gradient(#dfe3e1 1px,transparent 1px),linear-gradient(90deg,#dfe3e1 1px,transparent 1px);background-size:100% 30px,92px 100%}
.tabs{position:absolute;left:0;right:0;bottom:0;height:44px;background:#e9eceb;border-top:1px solid #c9cecc}

.tabs span+span{left:200px;background:none;border:none;color:#666}
.cards{position:absolute;top:96px;left:70px;right:24px;display:flex;gap:16px}
.cards div{flex:1;height:96px;background:#fff;border:2px solid #cfd5d2;border-radius:10px;box-shadow:0 4px 10px #0002}
.cards div:before{content:"";display:block;margin:16px 16px 12px;width:55%;height:10px;border-radius:5px;background:#b9c0bd}
.cards div:after{content:"";display:block;margin:0 16px;width:70%;height:28px;border-radius:6px;background:#107C41}
.chart{position:absolute;left:70px;right:24px;top:212px;bottom:64px;background:#fff;border:2px solid #cfd5d2;border-radius:10px}

.bars div{flex:1;background:#107C41;border-radius:4px 4px 0 0}
.kpi{position:absolute;left:250px;top:370px;width:540px;height:300px;background:#fff;border-radius:26px;transform:rotate(-4deg);box-shadow:0 30px 90px #000e,0 0 0 8px #e5252a,0 0 140px #e5252a66}
.kpi h4{margin:24px 0 0 38px;font:800 30px Inter;color:#6a726e}
.kpi .v{position:absolute;left:26px;top:72px;font:900 182px Inter;color:#e5252a;letter-spacing:-12px;line-height:1;white-space:nowrap}

.t span{display:block;font-size:150px}
